name: NanaHopper
version: '${version}'
description: A modern Minecraft plugin supporting Minecraft 1.21+
author: Block_Bring
authors: [ Block_Bring ]
api-version: 1.21
main: top.imbring.nanaHopper.NanaHopper
folia-supported: true

commands:
  hopper:
    description: Manage hoppers taken over by NanaHopper.
    usage: /hopper <claim|release|speed [+/-value|reset]|editor <true|false|claim|release|speed [value]>>
    permission: nanahopper.command.hopper
  nanahopper:
    description: NanaHopper plugin management command.
    usage: /nanahopper <reload>
    permission: nanahopper.command.admin

permissions:
  nanahopper.command.hopper:
    description: Allows using the /hopper command.
    default: op
  nanahopper.command.admin:
    description: Allows using the /nanahopper management command.
    default: op
