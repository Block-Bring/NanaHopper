# NanaHopper configuration

# Language file used for plugin messages (file name without .yml).
# Bundled options: locale_us, locale_cn.
# Custom languages can be created by copying an existing file in the lang/ folder.
language: locale_cn

# Whether to refresh the hopper management panel after each command.
# When enabled, commands like /hopper claim, /hopper release, and /hopper speed
# will show an updated panel followed by the operation result, simulating a
# TUI-like experience. Disable this to only show the operation result.
refresh-panel-after-command: true
